name: Validar circuito

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mokxi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: Simular componentes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restaurar compilador y runtimes Mokxi
        uses: actions/cache@v4
        with:
          path: ~/.cache/mokxi
          key: mokxi-${{ runner.os }}-${{ hashFiles('**/mokxi.test.yaml', '**/*.ino', '**/*.cpp', '**/*.h', '**/*.json') }}
          restore-keys: mokxi-${{ runner.os }}-

      - name: Ejecutar escenarios Mokxi
        run: npx @mokxi/cli test --scenario mokxi.test.yaml --junit mokxi-junit.xml

      - name: Publicar informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mokxi-junit
          path: mokxi-junit.xml
          if-no-files-found: warn
          retention-days: 14
